name: unfurl-fx

# Builds fluxer-unfurl with this branch's patches applied on top of the
# upstream revision behind ghcr.io/fluxerapp/fluxer-unfurl:v1 (or a given one).

on:
  push:
    branches: [unfurl-fx]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: Upstream fluxerapp/fluxer commit to build (empty = revision of fluxer-unfurl:v1)
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: unfurl-fx-${{ inputs.revision || 'v1' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fluxer-unfurl
  UPSTREAM_REPO: fluxerapp/fluxer
  UPSTREAM_IMAGE: fluxerapp/fluxer-unfurl

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
      tag: ${{ steps.rev.outputs.tag }}
      track_v1: ${{ steps.rev.outputs.track_v1 }}
      build: ${{ steps.rev.outputs.build }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve upstream revision
        id: rev
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REVISION" ]; then
            rev=$(gh api "repos/$UPSTREAM_REPO/commits/$INPUT_REVISION" --jq .sha)
            track_v1=false
          else
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:$UPSTREAM_IMAGE:pull" | jq -r .token)
            accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
            get() { curl -fsSL -H "Authorization: Bearer $token" -H "Accept: $accept" "https://ghcr.io/v2/$UPSTREAM_IMAGE/$1"; }
            manifest=$(get manifests/v1)
            if jq -e .manifests >/dev/null <<<"$manifest"; then
              manifest=$(get "manifests/$(jq -r '[.manifests[] | select(.platform.architecture=="arm64")][0].digest' <<<"$manifest")")
            fi
            rev=$(get "blobs/$(jq -r .config.digest <<<"$manifest")" | jq -r '.config.Labels["org.opencontainers.image.revision"]')
            track_v1=true
          fi
          tag="fx-${rev:0:12}-${GITHUB_SHA:0:7}"
          build=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
            build=false
          fi
          echo "upstream=$rev tag=$tag track_v1=$track_v1 build=$build"
          {
            echo "rev=$rev"
            echo "tag=$tag"
            echo "track_v1=$track_v1"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Apply patches on upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ needs.resolve.outputs.rev }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/compare/${UPSTREAM_REPO%%/*}:main...$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.patch' > fx.patch
          grep '^Subject:' fx.patch
          git init -q src
          cd src
          git fetch -q --depth=1 "https://github.com/$UPSTREAM_REPO.git" "$REV"
          git checkout -q FETCH_HEAD
          git -c user.name=unfurl-fx -c user.email=unfurl-fx@localhost am -q ../fx.patch
          git log --oneline -5

      - name: Test
        run: docker run --rm -v "$PWD/src:/src" -w /src rust:1-trixie cargo test --locked -p fluxer-unfurl

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: src
          file: src/fluxer_unfurl/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.rev }}
          build-args: |
            BUILD_VERSION=v1-fx
            SOURCE_SHA=${{ needs.resolve.outputs.rev }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Publish multi-arch tags
        env:
          REV: ${{ needs.resolve.outputs.rev }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TRACK_V1: ${{ needs.resolve.outputs.track_v1 }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$TAG" -t "$IMAGE:fx-${REV:0:12}")
          if [ "$TRACK_V1" = true ]; then tags+=(-t "$IMAGE:v1-fx"); fi
          cd digests
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
